<svg width="840" height="235" viewBox="0 0 840 235" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Megnix AI Flagship Architecture">
  <defs>
    <linearGradient id="outerBg" x1="0" y1="0" x2="840" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <linearGradient id="outerStroke" x1="0" y1="0" x2="840" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#388BFD" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="56" x2="0" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="233" rx="16" fill="url(#outerBg)" stroke="url(#outerStroke)" stroke-width="1.25" />

  <!-- Header -->
  <rect x="24" y="19" width="6" height="18" rx="3" fill="#58A6FF" />
  <text x="38" y="33" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.8">FLAGSHIP SYSTEM // MEGNIX AI</text>

  <rect x="628" y="17" width="188" height="24" rx="12" fill="#1F6FEB" fill-opacity="0.16" stroke="#58A6FF" stroke-opacity="0.5" stroke-width="1" />
  <text x="722" y="32.5" text-anchor="middle" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">EXPLORE MEGNIX-AI -&gt;</text>

  <!-- Pillar 1: Desktop Operator -->
  <rect x="24" y="56" width="253" height="156" rx="12" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
  <rect x="24" y="56" width="253" height="3" rx="1.5" fill="#58A6FF" />
  <text x="40" y="80" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">01 // DESKTOP AI AGENT</text>
  <line x1="40" y1="91" x2="261" y2="91" stroke="#21262D" stroke-width="1" />
  <text x="40" y="112" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Rust + Tauri v2 + WebView2</text>
  <text x="40" y="132" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Ollama + BYOK OS Keyring</text>
  <text x="40" y="152" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Win32 UIA &amp; Job Sandbox</text>
  <text x="40" y="172" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Stdio MCP Host &amp; WinRT OCR</text>
  <text x="40" y="192" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Piper TTS, AEC3 &amp; fastembed</text>

  <!-- Pillar 2: E2E Mobile Mesh -->
  <rect x="293" y="56" width="254" height="156" rx="12" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
  <rect x="293" y="56" width="254" height="3" rx="1.5" fill="#A371F7" />
  <text x="309" y="80" fill="#D2A8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">02 // E2E MOBILE MESH</text>
  <line x1="309" y1="91" x2="531" y2="91" stroke="#21262D" stroke-width="1" />
  <text x="309" y="112" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• 7-Crate Rust + Flutter FFI</text>
  <text x="309" y="132" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• X25519 ECDH + HKDF Derive</text>
  <text x="309" y="152" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Ed25519 + AES-GCM Frames</text>
  <text x="309" y="172" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Axum WebSocket Relay :9890</text>
  <text x="309" y="192" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• GDI Capture &amp; SendInput</text>

  <!-- Pillar 3: Licensing Stack -->
  <rect x="563" y="56" width="253" height="156" rx="12" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
  <rect x="563" y="56" width="253" height="3" rx="1.5" fill="#F97316" />
  <text x="579" y="80" fill="#FFA657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">03 // LICENSING ENGINE</text>
  <line x1="579" y1="91" x2="800" y2="91" stroke="#21262D" stroke-width="1" />
  <text x="579" y="112" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Cloudflare Workers + Hono</text>
  <text x="579" y="132" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• D1 SQL + KV Edge Cache</text>
  <text x="579" y="152" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Ed25519 Offline Verify</text>
  <text x="579" y="172" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• SHA-256 Hardware Binding</text>
  <text x="579" y="192" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">• Trust Scores &amp; Admin Deck</text>
</svg>
